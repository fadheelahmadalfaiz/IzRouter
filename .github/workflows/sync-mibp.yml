name: Sync MIBP

# MANUAL ONLY — merges the fork base (mhiqrambg/9router-mibp-version) into the
# union branch `master`.
#
# Why manual? mibp changes rarely (it is the fork base this repo descends from),
# so there is no value in polling it hourly. decolua — the fast-moving feature
# upstream — is the one that needs an hourly sync, and that lives in
# sync-upstream.yml. Splitting the two keeps exactly ONE workflow owning
# `master` on a schedule, so two crons can never race on the same branch.
#
# Run this when mibp publishes a release you want to absorb:
#   Actions -> Sync MIBP -> Run workflow
#
# What it does:
#   1. Merge mibp/master into master (-X ours: on a plain conflict, master's
#      union content wins, so the fork's customizations are never clobbered).
#   2. Restore this fork's own CI files (mibp does not carry them).
#   3. Re-apply custom patches + repair fork features lost in the merge.
#   4. Hard-gate: refuse to push a broken union.
#   5. Push (never force) and rebuild the image only when the tree changed.

on:
  workflow_dispatch:
    inputs:
      skip_deps:
        description: Skip npm dependency refresh
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  # Shares the `master` group with sync-upstream.yml so the two workflows can
  # never push master concurrently.
  group: sync-master
  cancel-in-progress: false

env:
  MIBP_UPSTREAM: https://github.com/mhiqrambg/9router-mibp-version.git
  BRANCH: master

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.sync.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master
          # GH_PAT (not GITHUB_TOKEN) is required: this job restores and pushes
          # files under .github/workflows/, which GITHUB_TOKEN may not modify
          # ("refusing to allow a GitHub App to create or update workflow ...").
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Merge mibp upstream -> master
        id: sync
        env:
          INPUT_SKIP_DEPS: ${{ inputs.skip_deps }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add mibp "$MIBP_UPSTREAM" || git remote set-url mibp "$MIBP_UPSTREAM"
          git fetch mibp master
          git fetch origin "$BRANCH" || true

          git checkout "$BRANCH"
          BEFORE_TREE=$(git rev-parse "HEAD^{tree}")

          # 1) Merge the fork base. `-X ours` so a plain conflict keeps master's
          #    union content: master is already a superset of mibp, so mibp must
          #    only ever be additive here.
          if git merge-base --is-ancestor "mibp/master" HEAD; then
            echo "Already up to date with mibp/master."
          elif git merge --ff-only "mibp/master"; then
            echo "Fast-forwarded $BRANCH to mibp/master"
          elif git merge "mibp/master" --no-edit -X ours; then
            echo "Merged mibp/master into $BRANCH (ours on conflict)"
          else
            git merge --abort 2>/dev/null || true
            echo "::error::mibp/master merge failed; refusing to touch $BRANCH."
            exit 1
          fi

          # Abort if a merge ever introduces conflict markers.
          if git grep -n -E '^(<<<<<<<|>>>>>>>) ' -- .; then
            echo "::error::Conflict markers found after merge; aborting."
            exit 1
          fi

          # 2) Protect this fork's own CI. mibp does not carry these files, so a
          #    merge would DELETE the sync workflows and OVERWRITE
          #    docker-publish.yml. Restore the pre-merge versions from BEFORE_REF.
          git fetch origin "$BRANCH"
          BEFORE_REF=$(git rev-parse "origin/$BRANCH")
          for f in \
            .github/workflows/sync-upstream.yml \
            .github/workflows/sync-mibp.yml \
            .github/workflows/docker-publish.yml \
            .github/workflows/gitbook-pages.yml.disabled \
            .github/dependabot.yml
          do
            if git cat-file -e "$BEFORE_REF:$f" 2>/dev/null; then
              git checkout "$BEFORE_REF" -- "$f"
              echo "Restored $f from $BEFORE_REF"
            fi
          done

          # 3a) Guard the fork-only chat handler. Upstream dropped
          #     `preferredConnectionId` from src/sse/handlers/chat.js, but this
          #     fork needs it (Antigravity MITM pins an account via
          #     `x-connection-id`). An orphan declaration/usage split throws
          #     `ReferenceError: preferredConnectionId is not defined`.
          CHAT=src/sse/handlers/chat.js
          if git cat-file -e "$BEFORE_REF:$CHAT" 2>/dev/null; then
            USES=$(grep -c 'preferredConnectionId' "$CHAT" || true)
            DECLS=$(grep -cE '(const|let|var)[[:space:]]+preferredConnectionId' "$CHAT" || true)
            if [ "$USES" -gt 0 ] && [ "$DECLS" -eq 0 ]; then
              echo "::warning::$CHAT has orphan preferredConnectionId (uses=$USES decls=$DECLS); restoring our version."
              git checkout "$BEFORE_REF" -- "$CHAT"
            else
              echo "$CHAT OK (uses=$USES decls=$DECLS)"
            fi
          fi
          for f in tests/unit/preferredConnectionIdScope.test.js; do
            if git cat-file -e "$BEFORE_REF:$f" 2>/dev/null && [ ! -f "$f" ]; then
              git checkout "$BEFORE_REF" -- "$f"
              echo "Restored $f from $BEFORE_REF"
            fi
          done

          # 3b) Re-apply the fork's durable custom patches (idempotent, surgical).
          if [ -f scripts/apply-custom-patches.mjs ]; then
            echo "::group::apply custom patches (fork features)"
            node scripts/apply-custom-patches.mjs 2>&1 | tail -n 40
            echo "::endgroup::"
          else
            echo "::error::scripts/apply-custom-patches.mjs missing; cannot restore fork customizations."
            exit 1
          fi

          # 3c) Repair fork snippets silently dropped by the merge.
          if [ -f scripts/guard-fork-features.mjs ]; then
            echo "::group::guard fork features lost by the merge"
            GUARD_RC=0
            node scripts/guard-fork-features.mjs 2>&1 || GUARD_RC=$?
            echo "::endgroup::"
            if [ "$GUARD_RC" -ne 0 ]; then
              echo "::error::Fork features were dropped by the merge and could not be auto-repaired (see the [detect-only] lines above). Refusing to push $BRANCH. Repair them manually on the union branch, then re-run this workflow."
              exit 1
            fi
          else
            echo "::error::scripts/guard-fork-features.mjs missing; cannot verify the union."
            exit 1
          fi

          # 4) Refresh dependencies within their declared semver ranges.
          if [ "${INPUT_SKIP_DEPS:-false}" != "true" ] && [ -f package.json ]; then
            echo "::group::npm update (semver-safe)"
            npm update --no-audit --no-fund 2>&1 | tail -n 40 || \
              echo "npm update failed; continuing with upstream code only."
            echo "::endgroup::"

            # `npm update` can drop the top-level @emnapi entries that npm 10
            # (node:22-alpine in the Docker image) needs for `npm ci`. Regenerate
            # the lockfile with npm 10 and refuse to push an incompatible one,
            # instead of pushing a commit whose Docker build dies. See AGENTS.md 1.
            echo "::group::lockfile npm-10 normalisation"
            npx -y npm@10.9.8 install --package-lock-only --no-audit --no-fund 2>&1 | tail -n 20 || true
            node scripts/verify-lockfile-npm10.mjs
            echo "::endgroup::"
          else
            echo "Dependency refresh skipped."
          fi

          # 5a) Hard gate: never push an orphan preferredConnectionId.
          if [ -f "$CHAT" ]; then
            USES=$(grep -c 'preferredConnectionId' "$CHAT" || true)
            DECLS=$(grep -cE '(const|let|var)[[:space:]]+preferredConnectionId' "$CHAT" || true)
            if [ "$USES" -gt 0 ] && [ "$DECLS" -eq 0 ]; then
              echo "::error::$CHAT would throw 'preferredConnectionId is not defined' (uses=$USES decls=$DECLS). Refusing to push."
              exit 1
            fi
            node --check "$CHAT" 2>&1 || { echo "::error::$CHAT failed syntax check"; exit 1; }
          fi

          # 5b) Hard gate: every fork feature must survive the union.
          if ! node scripts/guard-fork-features.mjs --check; then
            echo "::error::master lost one or more fork features after the merge. Refusing to push."
            exit 1
          fi

          # 6) Commit only when the working tree actually changed.
          git add -A
          if git diff --cached --quiet; then
            echo "Working tree clean after sync."
          else
            git commit -m "chore(sync): merge mibp upstream into master"
          fi

          # 7) Compare TREE hashes (content), not commit SHAs: a no-op merge
          #    commit must not trigger a rebuild.
          AFTER_TREE=$(git rev-parse "HEAD^{tree}")
          if [ "$BEFORE_TREE" = "$AFTER_TREE" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No content changes (tree $AFTER_TREE)"
          else
            # Plain push: this workflow never rewrites history, so no force.
            git push origin "$BRANCH"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Pushed $BRANCH (tree $BEFORE_TREE -> $AFTER_TREE)"
          fi

  # Self-contained GHCR-only build. We deliberately do NOT reuse
  # docker-publish.yml: that workflow targets tag releases (`v*`).
  build-and-push:
    needs: sync
    if: needs.sync.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      # GHCR image references must be lowercase, but this repo's name (IzRouter)
      # is not. Normalise once and reuse it in metadata + cache refs.
      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional: log in to Docker Hub when credentials exist (avoids the shared
      # runner IP 429s when pulling the pinned base image).
      - name: Log in to Docker Hub (optional)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # Pre-pull the pinned base image with retries/backoff.
      - name: Pre-pull base image (retry on rate limit)
        run: |
          set -euo pipefail
          BASE_IMAGE="${{ vars.NODE_BASE_IMAGE || 'node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32' }}"
          for attempt in 1 2 3 4 5; do
            echo "docker pull attempt ${attempt}: ${BASE_IMAGE}"
            if docker pull "${BASE_IMAGE}"; then
              echo "Base image pulled successfully."
              exit 0
            fi
            echo "Pull failed (attempt ${attempt}); backing off $((attempt * 15))s..."
            sleep $((attempt * 15))
          done
          echo "::error::Failed to pull ${BASE_IMAGE} after 5 attempts (likely Docker Hub rate limit)."
          exit 1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.img.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.img.outputs.name }}:buildcache,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false
